<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>venasataa</title>

  <script type="module" src="https://esm.run/@material/web/ripple/ripple.js"></script>

  <style>
    :root {
      --md-sys-color-background: #fbfdf7;
      --md-sys-color-surface-container: #edf3e5;
      --md-sys-color-on-surface: #191d16;
      --md-sys-color-primary-container: #d8e7cb;
      --md-sys-color-on-primary-container: #111f0c;

      --md-shape-corner-large: 24px;
      --md-shape-corner-small: 4px;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --md-sys-color-background: #1a1c18;
        --md-sys-color-surface-container: #20251f;
        --md-sys-color-on-surface: #e2e3dd;
        --md-sys-color-primary-container: #3b4b36;
        --md-sys-color-on-primary-container: #b8e1a9;
      }
    }

    body {
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: var(--md-sys-color-background);
      font-family: 'Roboto', sans-serif;
    }

    .card-group {
      display: flex;
      flex-direction: column;
      gap: 2px;
      width: 280px;
    }

    .m3-card {
      position: relative;
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 16px;
      background: var(--md-sys-color-surface-container);
      color: var(--md-sys-color-on-surface);
      text-decoration: none;
      -webkit-tap-highlight-color: transparent;
      transition: border-radius 200ms cubic-bezier(0.2, 0, 0, 1);
    }

    .m3-card md-ripple {
      border-radius: inherit;
    }

    .m3-card:first-child {
      border-radius: var(--md-shape-corner-large) var(--md-shape-corner-large) var(--md-shape-corner-small) var(--md-shape-corner-small);
    }

    .m3-card:last-child {
      border-radius: var(--md-shape-corner-small) var(--md-shape-corner-small) var(--md-shape-corner-large) var(--md-shape-corner-large);
    }

    .m3-card:hover,
    .m3-card:focus-visible {
      border-radius: var(--md-shape-corner-large);
      z-index: 2;
    }

    .m3-card:focus-visible {
      outline: none;
    }

    .icon-container {
      width: 40px;
      height: 40px;
      background: var(--md-sys-color-primary-container);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    svg {
      width: 24px;
      height: 24px;
      fill: var(--md-sys-color-on-primary-container);
    }

    .label-text {
      font-size: 16px;
      font-weight: 500;
    }

    md-ripple:not(:defined) {
      position: absolute;
      inset: 0;
    }
  </style>
</head>
<body>

  <div class="card-group">
    <a href="https://github.com/venasataa" class="m3-card">
      <md-ripple></md-ripple>
      <div class="icon-container">
        <svg viewBox="0 0 24 24">
          <path d="M12,2A10,10 0 0,0 2,12C2,16.42 4.87,20.17 8.84,21.5C9.34,21.58 9.5,21.27 9.5,21C9.5,20.77 9.5,20.14 9.5,19.31C6.73,19.91 6.14,17.97 6.14,17.97C5.68,16.81 5.03,16.5 5.03,16.5C4.12,15.88 5.1,15.9 5.1,15.9C6.1,15.97 6.63,16.93 6.63,16.93C7.5,18.45 8.97,18 9.54,17.76C9.63,17.11 9.89,16.67 10.17,16.42C7.95,16.17 5.62,15.31 5.62,11.5C5.62,10.39 6,9.5 6.65,8.79C6.55,8.54 6.2,7.5 6.75,6.15C6.75,6.15 7.59,5.88 9.5,7.17C10.29,6.95 11.15,6.84 12,6.84C12.85,6.84 13.71,6.95 14.5,7.17C16.41,5.88 17.25,6.15 17.25,6.15C17.8,7.5 17.45,8.54 17.35,8.79C18,9.5 18.38,10.39 18.38,11.5C18.38,15.32 16.04,16.16 13.81,16.41C14.17,16.72 14.5,17.33 14.5,18.26C14.5,19.6 14.5,20.68 14.5,21C14.5,21.27 14.66,21.59 15.17,21.5C19.14,20.16 22,16.42 22,12A10,10 0 0,0 12,2Z" />
        </svg>
      </div>
      <span class="label-text">GitHub</span>
    </a>

    <a href="https://t.me/venasataa" class="m3-card">
      <md-ripple></md-ripple>
      <div class="icon-container">
        <svg viewBox="0 0 24 24">
          <path d="M9.78,18.65L10.06,14.42L17.74,7.5C18.08,7.19 17.67,7.04 17.22,7.31L7.74,13.3L3.64,12C2.76,11.75 2.75,11.14 3.84,10.7L19.81,4.54C20.54,4.21 21.24,4.72 20.96,5.84L18.24,18.65C18.05,19.56 17.5,19.78 16.74,19.36L12.6,16.3L10.61,18.23C10.38,18.46 10.19,18.65 9.78,18.65Z" />
        </svg>
      </div>
      <span class="label-text">Telegram</span>
    </a>
  </div>
</body>

<script>
  document.querySelectorAll('.m3-card').forEach(card => {
    const ripple = card.querySelector('md-ripple');

    card.addEventListener('pointerdown', (e) => {
      if (e.button !== 0) return;
      
      card.classList.add('is-pressed');

      const handlePointerUpOrCancel = () => {
        card.classList.remove('is-pressed');
        card.blur(); 
        window.removeEventListener('pointerup', handlePointerUpOrCancel);
        window.removeEventListener('pointercancel', handlePointerUpOrCancel);
      };

      window.addEventListener('pointerup', handlePointerUpOrCancel);
      window.addEventListener('pointercancel', handlePointerUpOrCancel);
    });

    card.addEventListener('focusin', () => {
      if (card.matches(':focus-visible') && ripple) {
        ripple.hovered = true;
      }
    });

    card.addEventListener('focusout', () => {
      if (ripple) {
        ripple.hovered = false;
      }
    });
  });
</script>

</html>
